<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tree of Love</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #ffe6eb;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      height: 100vh;
      width: 100vw;
      position: relative;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    /* Dastlabki markaziy tugma */
    #startBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s ease;
    }
    #startBtn:hover {
      transform: translate(-50%, -50%) scale(1.1);
    }
    .heart-icon {
      width: 44px;
      height: 40px;
      background-color: #ff3366;
      display: inline-block;
      position: relative;
      transform: rotate(-45deg);
      box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
      animation: pulse 1.2s infinite;
    }
    .heart-icon::before,
    .heart-icon::after {
      content: "";
      width: 44px;
      height: 40px;
      background-color: #ff3366;
      border-radius: 50%;
      position: absolute;
    }
    .heart-icon::before {
      top: -22px;
      left: 0;
    }
    .heart-icon::after {
      top: 0;
      right: -22px;
    }
    .btn-text {
      margin-top: 25px;
      font-size: 13px;
      color: #777;
      letter-spacing: 1px;
    }
    @keyframes pulse {
      0%, 100% { transform: rotate(-45deg) scale(1); }
      50% { transform: rotate(-45deg) scale(1.15); }
    }

    /* Matn qismi */
    #text-box {
      position: absolute;
      z-index: 5;
      font-size: 14px;
      line-height: 1.6;
      color: #444;
      white-space: pre-wrap;
      pointer-events: none;
    }
    .cursor {
      display: inline-block;
      width: 2px;
      height: 14px;
      background-color: #ff3366;
      vertical-align: middle;
      animation: blink 0.7s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Taymer qismi */
    #clock-box {
      position: absolute;
      z-index: 5;
      color: #444;
      opacity: 0;
      transition: opacity 1.5s ease;
      pointer-events: none;
    }
    #clock-box p {
      font-size: 13px;
      color: #666;
      margin-bottom: 5px;
    }
    .digit {
      font-size: 26px;
      font-weight: bold;
      color: #ff3366;
    }
    .unit {
      font-size: 13px;
      color: #777;
      margin-right: 8px;
      margin-left: 2px;
    }

    /* Mobil ekranlar uchun maxsus joylashuv (Responsive) */
    @media (max-width: 768px) {
      #text-box {
        left: 6%;
        top: 4%;
        width: 88%;
        font-size: 12px;
        line-height: 1.45;
      }
      #clock-box {
        left: 6%;
        bottom: 3%;
        width: 88%;
      }
      .digit {
        font-size: 20px;
      }
      .unit {
        font-size: 11px;
        margin-right: 5px;
      }
    }

    /* Kompyuter ekranlari uchun */
    @media (min-width: 769px) {
      #text-box {
        left: 8%;
        top: 15%;
        width: 340px;
        font-size: 14px;
      }
      #clock-box {
        left: 8%;
        bottom: 10%;
      }
      .digit {
        font-size: 32px;
      }
      .unit {
        font-size: 14px;
        margin-right: 10px;
      }
    }
  </style>
</head>
<body>

  <div id="startBtn">
    <div class="heart-icon"></div>
    <div class="btn-text">Click here</div>
  </div>

  <div id="text-box"><span id="typed-text"></span><span class="cursor" id="cursor"></span></div>

  <div id="clock-box">
    <p>Yulduzlar va oy birga bo'lgan vaqt:</p>
    <div>
      <span class="digit" id="days">00</span><span class="unit">kun</span>
      <span class="digit" id="hours">00</span><span class="unit">soat</span>
      <span class="digit" id="minutes">00</span><span class="unit">daqiqa</span>
      <span class="digit" id="seconds">00</span><span class="unit">soniya</span>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const clockBox = document.getElementById('clock-box');
    const typedTextEl = document.getElementById('typed-text');
    const cursorEl = document.getElementById('cursor');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    const isMobile = width <= 768;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const colors = [
      '#ff4d6d', '#ff758f', '#ff8fa3', '#c9184a',
      '#ffb3c1', '#f72585', '#ffbe0b', '#fb5607', '#ff0054'
    ];

    function drawHeart(x, y, size, color, alpha) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(size, size);
      ctx.rotate(Math.PI);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(0, -3, -5, -15, -15, -15);
      ctx.bezierCurveTo(-30, -15, -30, 7.5, -30, 7.5);
      ctx.bezierCurveTo(-30, 20, -15, 32, 0, 42);
      ctx.bezierCurveTo(15, 32, 30, 20, 30, 7.5);
      ctx.bezierCurveTo(30, 7.5, 30, -15, 15, -15);
      ctx.bezierCurveTo(5, -15, 0, -3, 0, 0);
      ctx.fill();
      ctx.restore();
    }

    function getHeartPoint(t, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x: x * scale, y: y * scale };
    }

    let branches = [];
    let leaves = [];
    let treeDone = false;
    let growthProgress = 0;

    // Telefon va kompyuter uchun daraxt markazi va kattaligi
    const treeCenterX = isMobile ? width * 0.5 : width * 0.68;
    const treeBaseY = isMobile ? height * 0.88 : height - 40;
    const treeCrownY = isMobile ? height * 0.58 : height * 0.40;

    function buildBranches() {
      branches = [];
      const trunkLen = isMobile ? height * 0.16 : Math.min(height * 0.22, 140);

      function branch(x, y, length, angle, bWidth, depth) {
        if (depth <= 0) return;
        const x2 = x + Math.cos(angle) * length;
        const y2 = y + Math.sin(angle) * length;

        branches.push({
          x1: x, y1: y,
          x2: x2, y2: y2,
          width: bWidth,
          depth: depth
        });

        const nextLen = length * 0.72;
        const nextWidth = bWidth * 0.68;

        branch(x2, y2, nextLen, angle - 0.44, nextWidth, depth - 1);
        branch(x2, y2, nextLen, angle + 0.44, nextWidth, depth - 1);
        if (depth > 2) {
          branch(x2, y2, nextLen * 0.75, angle + 0.05, nextWidth, depth - 1);
        }
      }

      branch(treeCenterX, treeBaseY, trunkLen, -Math.PI / 2, isMobile ? 8 : 12, 5);
    }

    function buildLeaves() {
      leaves = [];
      const totalLeaves = isMobile ? 480 : 620;
      const baseScale = isMobile ? (width * 0.021) : (Math.min(width, height) * 0.016);

      for (let i = 0; i < totalLeaves; i++) {
        const t = Math.random() * Math.PI * 2;
        const r = Math.sqrt(Math.random());
        const scale = baseScale * r;
        const pos = getHeartPoint(t, scale);

        leaves.push({
          x: treeCenterX + pos.x + (Math.random() - 0.5) * 12,
          y: treeCrownY + pos.y + (Math.random() - 0.5) * 12,
          size: 0,
          maxSize: (isMobile ? 0.12 : 0.16) + Math.random() * 0.16,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 0,
          delay: Math.floor(Math.random() * 110)
        });
      }
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      // Yer chizig'i
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 2;
      ctx.beginPath();
      const lineStart = isMobile ? width * 0.25 : width * 0.48;
      const lineEnd = isMobile ? width * 0.75 : width * 0.88;
      ctx.moveTo(lineStart, treeBaseY);
      ctx.lineTo(lineEnd, treeBaseY);
      ctx.stroke();

      if (growthProgress < 1) {
        growthProgress += 0.016;
        if (growthProgress >= 1) growthProgress = 1;
      }

      branches.forEach(b => {
        const branchStart = (5 - b.depth) * 0.18;
        const branchEnd = branchStart + 0.25;

        let localP = (growthProgress - branchStart) / (branchEnd - branchStart);
        localP = Math.max(0, Math.min(1, localP));

        if (localP > 0) {
          ctx.beginPath();
          ctx.strokeStyle = '#1b7a63';
          ctx.lineCap = 'round';
          ctx.lineWidth = b.width;
          ctx.moveTo(b.x1, b.y1);
          ctx.lineTo(
            b.x1 + (b.x2 - b.x1) * localP,
            b.y1 + (b.y2 - b.y1) * localP
          );
          ctx.stroke();
        }
      });

      if (growthProgress >= 0.8) {
        if (!treeDone) {
          treeDone = true;
          startTyping();
          clockBox.style.opacity = '1';
        }

        leaves.forEach(leaf => {
          if (leaf.delay > 0) {
            leaf.delay--;
          } else {
            if (leaf.size < leaf.maxSize) {
              leaf.size += 0.007;
              leaf.alpha = Math.min(0.9, leaf.alpha + 0.04);
            }
          }
          if (leaf.size > 0) {
            drawHeart(leaf.x, leaf.y, leaf.size, leaf.color, leaf.alpha);
          }
        });
      }

      requestAnimationFrame(animate);
    }

    const poem = `Seni sevaman

Sen bu dunyodagi eng go'zal yuraksan –
Pokiza, mehribon, nazokat timsolidir.
Umid qilamanki, sanga munosib bo'layman,
Faqat bilishingni istayman: sen menga azizsan.

Seni sevaman — gullar ochilguncha,

Yulduzlar osmondan ko'z qimirlatguncha,
Bahor kelib, qushlar nag'ma kuylaguncha,
Va umrimning so'nggi nafasigacha...`;

    let charIndex = 0;
    function startTyping() {
      function type() {
        if (charIndex < poem.length) {
          typedTextEl.textContent += poem.charAt(charIndex);
          charIndex++;
          setTimeout(type, 50);
        } else {
          cursorEl.style.display = 'none';
        }
      }
      type();
    }

    const startDate = new Date();
    startDate.setDate(startDate.getDate() - 73);
    startDate.setHours(startDate.getHours() - 17);

    function updateClock() {
      const now = new Date();
      const diff = Math.floor((now - startDate) / 1000);

      const days = Math.floor(diff / (24 * 3600));
      const hours = Math.floor((diff % (24 * 3600)) / 3600);
      const minutes = Math.floor((diff % 3600) / 60);
      const seconds = diff % 60;

      document.getElementById('days').innerText = days + ' ';
      document.getElementById('hours').innerText = (hours < 10 ? '0' : '') + hours;
      document.getElementById('minutes').innerText = (minutes < 10 ? '0' : '') + minutes;
      document.getElementById('seconds').innerText = (seconds < 10 ? '0' : '') + seconds;
    }
    setInterval(updateClock, 1000);
    updateClock();

    startBtn.addEventListener('click', () => {
      startBtn.style.display = 'none';
      buildBranches();
      buildLeaves();
      animate();
    });
  </script>
</body>
</html>
